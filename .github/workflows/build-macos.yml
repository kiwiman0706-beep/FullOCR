name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          path: fullocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      # --- FullOCR + Docling + GUI, built into FullOCR.app ---
      - name: Install FullOCR (docling + gui + llm)
        working-directory: fullocr
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[docling,pdf,gui,llm]"
          uv pip install --python .venv/bin/python pyinstaller

      - name: Build FullOCR.app
        working-directory: fullocr
        run: .venv/bin/pyinstaller packaging/fullocr-gui-mac.spec

      # --- NDLOCR-Lite: separate license/deps, built as its own companion ---
      - name: Clone NDLOCR-Lite
        run: git clone --depth 1 https://github.com/ndl-lab/ndlocr-lite.git ndlocr-lite-src

      - name: Install NDLOCR-Lite deps
        working-directory: ndlocr-lite-src
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python pyinstaller

      - name: Build ndlocr-lite (mac)
        working-directory: ndlocr-lite-src
        run: >
          .venv/bin/pyinstaller
          --name ndlocr-lite
          --onedir
          --console
          --paths src
          --add-data "src/model:model"
          --add-data "src/config:config"
          src/ocr.py

      # --- Place the companion inside the .app bundle (next to the main exe) ---
      - name: Assemble distribution
        run: |
          cp -R ndlocr-lite-src/dist/ndlocr-lite \
            "fullocr/dist/FullOCR.app/Contents/MacOS/ndlocr-lite"

      # --- Package as a drag-to-Applications .dmg ---
      # A staging folder holds FullOCR.app plus an /Applications symlink; the
      # user drags the app onto it. Dropping a newer build over an existing
      # /Applications/FullOCR.app overwrites in place (Finder asks to replace),
      # so reinstalling upgrades. A .dmg still arrives zip-wrapped from GitHub's
      # artifact download, but a .dmg inside a zip is the normal Mac shape
      # (unzip once, mount, drag) — not the old zip-of-a-zip.
      - name: Build .dmg
        run: |
          mkdir -p dmg-staging
          cp -R fullocr/dist/FullOCR.app dmg-staging/FullOCR.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "FullOCR" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            FullOCR.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullOCR-macos-dmg
          path: FullOCR.dmg
          retention-days: 14
