name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fullocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      # --- FullOCR + Docling + GUI, built into dist/fullocr-gui/ ---
      - name: Install FullOCR (docling + gui)
        working-directory: fullocr
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe -e ".[docling,pdf,gui,llm]"
          uv pip install --python .venv\Scripts\python.exe pyinstaller

      - name: Build fullocr-gui.exe
        working-directory: fullocr
        run: .venv\Scripts\pyinstaller.exe packaging\fullocr-gui.spec

      # --- NDLOCR-Lite: separate license/deps, built as its own companion exe ---
      - name: Clone NDLOCR-Lite
        run: git clone --depth 1 https://github.com/ndl-lab/ndlocr-lite.git ndlocr-lite-src

      - name: Install NDLOCR-Lite deps
        working-directory: ndlocr-lite-src
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt
          uv pip install --python .venv\Scripts\python.exe pyinstaller

      - name: Build ndlocr-lite.exe
        working-directory: ndlocr-lite-src
        run: >
          .venv\Scripts\pyinstaller.exe
          --name ndlocr-lite
          --onedir
          --console
          --paths src
          --add-data "src\model;model"
          --add-data "src\config;config"
          src\ocr.py

      # --- Place the NDLOCR-Lite companion inside the app's onedir tree ---
      # The installer packages fullocr\dist\fullocr-gui\* wholesale, so the
      # companion just needs to sit next to fullocr-gui.exe (server._frozen_dir()
      # resolves ndlocr-lite\ndlocr-lite.exe from there at runtime).
      - name: Assemble distribution
        run: xcopy /E /I ndlocr-lite-src\dist\ndlocr-lite fullocr\dist\fullocr-gui\ndlocr-lite

      # --- Wrap it in a single self-updating installer (FullOCR-Setup.exe) ---
      # Same AppId across releases => reinstalling a newer setup upgrades in
      # place. Uploading the .exe directly (no Compress-Archive) avoids the
      # previous double-zip (self zip + GitHub's artifact zip).
      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] } else { $v = "0.0.0" }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: fullocr
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.ver.outputs.version }}
          packaging\fullocr.iss
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FullOCR-Setup-windows
          path: fullocr\installer\FullOCR-Setup.exe
          retention-days: 14
