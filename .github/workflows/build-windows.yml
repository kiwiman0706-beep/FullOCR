name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a GitHub Release with this tag (e.g. v0.1.0). Blank = just build the artifact."
        required: false
        default: ""
  push:
    tags:
      - "v*"

# タグ push 時に Release を作成/更新してインストーラを添付するため書込権限が要る。
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fullocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      # --- FullOCR + Docling + GUI, built into dist/fullocr-gui/ ---
      - name: Install FullOCR (docling + gui)
        working-directory: fullocr
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe -e ".[docling,pdf,gui,llm]"
          uv pip install --python .venv\Scripts\python.exe pyinstaller

      # バージョン（タグ or release_version から）。GUI 画面表示とインストーラ名に使う。
      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $inp = "${{ github.event.inputs.release_version }}"
          if ($inp -match '^v?(\d+\.\d+\.\d+)') { $v = $Matches[1] }
          elseif ($ref -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] }
          else { $v = "0.0.0" }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # GUI に表示するバージョンを __init__.py に焼き込む（凍結後もこの値が出る）。
      - name: Stamp version into package
        working-directory: fullocr
        shell: pwsh
        run: |
          $f = "src\fullocr\__init__.py"
          (Get-Content $f) -replace '__version__ = ".*"', '__version__ = "${{ steps.ver.outputs.version }}"' | Set-Content $f

      # Docling のレイアウト/表モデルをビルド前に取得（spec が docling_artifacts/ を同梱）。
      # 実行時 DL 失敗（Missing safetensors）を避け、オフラインで動くようにする。
      - name: Prefetch Docling models
        working-directory: fullocr
        run: .venv\Scripts\python.exe -c "from pathlib import Path; from docling.utils.model_downloader import download_models; download_models(output_dir=Path('docling_artifacts'))"

      - name: Build fullocr-gui.exe
        working-directory: fullocr
        run: .venv\Scripts\pyinstaller.exe packaging\fullocr-gui.spec

      # Guard: docling-parse dies at runtime if its glyph resources are missing.
      # Fail the build here rather than shipping an installer that can't convert.
      - name: Verify docling resources are bundled
        working-directory: fullocr
        shell: pwsh
        run: |
          $p = "dist\fullocr-gui\_internal\docling_parse\pdf_resources\glyphs\standard\additional.dat"
          if (!(Test-Path $p)) { Write-Error "Missing $p - docling_parse resources not bundled"; exit 1 }
          Write-Host "OK: docling_parse resources present"
          $m = "dist\fullocr-gui\_internal\docling_artifacts"
          $st = Get-ChildItem -Recurse -File $m -Filter *.safetensors -ErrorAction SilentlyContinue
          if (!$st) { Write-Error "No .safetensors under $m - Docling layout model not bundled"; exit 1 }
          Write-Host "OK: Docling models bundled ($($st.Count) safetensors)"

      # --- NDLOCR-Lite: separate license/deps, built as its own companion exe ---
      - name: Clone NDLOCR-Lite
        run: git clone --depth 1 https://github.com/ndl-lab/ndlocr-lite.git ndlocr-lite-src

      - name: Install NDLOCR-Lite deps
        working-directory: ndlocr-lite-src
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt
          uv pip install --python .venv\Scripts\python.exe pyinstaller

      - name: Build ndlocr-lite.exe
        working-directory: ndlocr-lite-src
        run: >
          .venv\Scripts\pyinstaller.exe
          --name ndlocr-lite
          --onedir
          --console
          --paths src
          --add-data "src\model;model"
          --add-data "src\config;config"
          src\ocr.py

      # --- Place the NDLOCR-Lite companion inside the app's onedir tree ---
      # The installer packages fullocr\dist\fullocr-gui\* wholesale, so the
      # companion just needs to sit next to fullocr-gui.exe (server._frozen_dir()
      # resolves ndlocr-lite\ndlocr-lite.exe from there at runtime).
      - name: Assemble distribution
        run: xcopy /E /I ndlocr-lite-src\dist\ndlocr-lite fullocr\dist\fullocr-gui\ndlocr-lite

      # --- Wrap it in a single self-updating installer (FullOCR-Setup.exe) ---
      # Same AppId across releases => reinstalling a newer setup upgrades in
      # place. Uploading the .exe directly (no Compress-Archive) avoids the
      # previous double-zip (self zip + GitHub's artifact zip).
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: fullocr
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.ver.outputs.version }}
          packaging\fullocr.iss
        shell: pwsh

      # Release を公開する場合は、Actions アーティファクト（別枠のストレージ容量を
      # 消費し、上限に達すると失敗する）にはアップロードしない。Release アセットは
      # この容量を消費しないので、リリース時は下の Publish 一本にする。
      - name: Upload installer (artifact)
        if: github.event.inputs.release_version == '' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: FullOCR-Setup-windows
          path: fullocr\installer\FullOCR-Setup.exe
          retention-days: 7

      # Release への公開は2通り: タグ(v*) push、または workflow_dispatch で
      # release_version を入れたとき。後者は runner の GITHUB_TOKEN でタグごと
      # サーバ側に作られる（このサンドボックスからは tag push が塞がれているため）。
      # 同じタグに macOS 側の .dmg も追記される（upsert）。
      - name: Publish installer to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
          files: fullocr/installer/FullOCR-Setup.exe
          fail_on_unmatched_files: true
